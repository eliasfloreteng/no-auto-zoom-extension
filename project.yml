name: NoAutoZoom
options:
  bundleIdPrefix: se.floreteng
  deploymentTarget:
    iOS: "26.2"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XQ9HKBVB36
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    # The app and its extension must share these, so they live here rather
    # than on a target. The Release action bumps the build number.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  NoAutoZoom:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.floreteng.noautozoom
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: No Auto Zoom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: NoAutoZoomExtension
        embed: true
  NoAutoZoomExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes: ["Resources/**"]
      - path: Extension/Resources
        buildPhase: resources
        excludes: ["images", "images/**"]
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.floreteng.noautozoom.extension
        PRODUCT_NAME: No Auto Zoom Extension
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: No Auto Zoom
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
schemes:
  # Shared, so Xcode Cloud can find it.
  NoAutoZoom:
    build:
      targets:
        NoAutoZoom: all
    archive:
      config: Release
